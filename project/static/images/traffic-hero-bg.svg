<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#040812"/>
      <stop offset="45%" stop-color="#071126"/>
      <stop offset="100%" stop-color="#0b1736"/>
    </linearGradient>
    
    <linearGradient id="cyanTrail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="purpleTrail" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff007a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7928ca" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0.18"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1600" height="900" fill="url(#bgGrad)" />

  <!-- City Skyline Silhouette in Distance -->
  <g fill="#060e20" opacity="0.65">
    <rect x="50" y="320" width="45" height="180" />
    <rect x="110" y="270" width="60" height="230" />
    <polygon points="140,240 120,270 160,270" fill="#09142e"/>
    <rect x="180" y="350" width="50" height="150" />
    <rect x="250" y="290" width="70" height="210" />
    <rect x="340" y="220" width="80" height="280" />
    <polygon points="380,180 350,220 410,220" fill="#09142e"/>
    <rect x="440" y="330" width="65" height="170" />
    
    <rect x="1120" y="310" width="70" height="190" />
    <rect x="1210" y="240" width="90" height="260" />
    <polygon points="1255,190 1225,240 1285,240" fill="#09142e"/>
    <rect x="1320" y="340" width="60" height="160" />
    <rect x="1400" y="280" width="85" height="220" />
    <rect x="1500" y="320" width="70" height="180" />
  </g>

  <!-- Skyline Windows / Digital Matrix Lights -->
  <g fill="#00f2fe" opacity="0.3">
    <circle cx="360" cy="250" r="1.5" />
    <circle cx="380" cy="270" r="1.5" />
    <circle cx="400" cy="290" r="1.5" />
    <circle cx="370" cy="330" r="1.5" />
    <circle cx="1230" cy="260" r="1.5" />
    <circle cx="1260" cy="290" r="1.5" />
    <circle cx="1245" cy="320" r="1.5" />
    <circle cx="1430" cy="300" r="1.5" />
    <circle cx="1450" cy="340" r="1.5" />
  </g>

  <!-- Horizon Glow -->
  <ellipse cx="800" cy="500" rx="650" ry="80" fill="#4facfe" opacity="0.08" filter="url(#softGlow)" />
  <ellipse cx="800" cy="500" rx="350" ry="40" fill="#7928ca" opacity="0.12" filter="url(#softGlow)" />

  <!-- Perspective Highway Grid Floor -->
  <g stroke="url(#gridGrad)" stroke-width="1.2">
    <!-- Horizontal Perspective Lines -->
    <line x1="0" y1="510" x2="1600" y2="510" opacity="0.3" />
    <line x1="0" y1="530" x2="1600" y2="530" opacity="0.4" />
    <line x1="0" y1="560" x2="1600" y2="560" opacity="0.5" />
    <line x1="0" y1="600" x2="1600" y2="600" opacity="0.6" />
    <line x1="0" y1="655" x2="1600" y2="655" opacity="0.7" />
    <line x1="0" y1="730" x2="1600" y2="730" opacity="0.8" />
    <line x1="0" y1="830" x2="1600" y2="830" opacity="0.9" />

    <!-- Vanishing Point Radial Lines from Horizon (800, 500) -->
    <line x1="800" y1="500" x2="-200" y2="900" />
    <line x1="800" y1="500" x2="100" y2="900" />
    <line x1="800" y1="500" x2="350" y2="900" />
    <line x1="800" y1="500" x2="550" y2="900" />
    <line x1="800" y1="500" x2="720" y2="900" />
    <line x1="800" y1="500" x2="880" y2="900" />
    <line x1="800" y1="500" x2="1050" y2="900" />
    <line x1="800" y1="500" x2="1250" y2="900" />
    <line x1="800" y1="500" x2="1500" y2="900" />
    <line x1="800" y1="500" x2="1800" y2="900" />
  </g>

  <!-- Glowing Central Traffic Highway Stream (Cyan / Blue / Purple) -->
  <!-- Left Inbound Highway (Cyan) -->
  <path d="M800,500 L680,900" stroke="#00f2fe" stroke-width="4" opacity="0.9" filter="url(#softGlow)"/>
  <path d="M800,500 L560,900" stroke="#00d4ff" stroke-width="3" opacity="0.7"/>
  <path d="M800,500 L420,900" stroke="#38bdf8" stroke-width="2" opacity="0.5"/>

  <!-- Right Outbound Highway (Purple / Magenta / Pink) -->
  <path d="M800,500 L920,900" stroke="#d946ef" stroke-width="4" opacity="0.9" filter="url(#softGlow)"/>
  <path d="M800,500 L1040,900" stroke="#a855f7" stroke-width="3" opacity="0.7"/>
  <path d="M800,500 L1180,900" stroke="#7928ca" stroke-width="2" opacity="0.5"/>

  <!-- Central Median Divider Line (Yellow / Electric Amber) -->
  <path d="M800,500 L800,900" stroke="#facc15" stroke-width="2.5" stroke-dasharray="16 12" opacity="0.85" filter="url(#softGlow)"/>

  <!-- Dynamic Traffic Data Nodes & Sensors -->
  <g>
    <!-- Sensor Node 1 -->
    <circle cx="730" cy="720" r="5" fill="#00f2fe" filter="url(#softGlow)"/>
    <circle cx="730" cy="720" r="14" fill="none" stroke="#00f2fe" stroke-width="1" opacity="0.4"/>
    <line x1="730" y1="720" x2="700" y2="670" stroke="#00f2fe" stroke-width="1" stroke-dasharray="3 3"/>
    <rect x="630" y="650" width="80" height="22" rx="4" fill="#091833" stroke="#00f2fe" stroke-width="1" opacity="0.85"/>
    <text x="670" y="665" font-family="'Courier New', monospace" font-size="10" fill="#00f2fe" text-anchor="middle" font-weight="bold">64 km/h</text>

    <!-- Sensor Node 2 -->
    <circle cx="870" cy="690" r="5" fill="#d946ef" filter="url(#softGlow)"/>
    <circle cx="870" cy="690" r="14" fill="none" stroke="#d946ef" stroke-width="1" opacity="0.4"/>
    <line x1="870" y1="690" x2="910" y2="640" stroke="#d946ef" stroke-width="1" stroke-dasharray="3 3"/>
    <rect x="900" y="620" width="85" height="22" rx="4" fill="#091833" stroke="#d946ef" stroke-width="1" opacity="0.85"/>
    <text x="942" y="635" font-family="'Courier New', monospace" font-size="10" fill="#ff76ea" text-anchor="middle" font-weight="bold">DENS: 78%</text>

    <!-- Sensor Node 3 Near Horizon -->
    <circle cx="785" cy="550" r="3" fill="#22c55e" filter="url(#softGlow)"/>
    <circle cx="815" cy="550" r="3" fill="#eab308" filter="url(#softGlow)"/>
  </g>

  <!-- High-Speed Vehicle Light Streaks (Blur Motion) -->
  <path d="M720,780 L690,880" stroke="#00f2fe" stroke-width="6" stroke-linecap="round" opacity="0.9" filter="url(#softGlow)"/>
  <path d="M620,830 L590,900" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
  <path d="M890,750 L930,860" stroke="#f43f5e" stroke-width="7" stroke-linecap="round" opacity="0.95" filter="url(#softGlow)"/>
  <path d="M990,800 L1040,890" stroke="#ec4899" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  <path d="M760,630 L745,690" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
</svg>
