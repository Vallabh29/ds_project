<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e1e38" />
      <stop offset="100%" stop-color="#081020" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Outer Hexagon / Shield -->
  <polygon points="50,6 90,26 90,74 50,94 10,74 10,26" fill="url(#shieldGrad)" stroke="url(#logoGrad)" stroke-width="3" filter="url(#glow)"/>
  
  <!-- Traffic Light Nodes & Connecting Data Highway -->
  <path d="M50,22 L50,78" stroke="url(#logoGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 4"/>
  <path d="M28,50 L72,50" stroke="url(#logoGrad)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Outer Orbit Nodes -->
  <circle cx="50" cy="24" r="5.5" fill="#00f2fe" filter="url(#glow)" />
  <circle cx="50" cy="50" r="7" fill="#4facfe" filter="url(#glow)" />
  <circle cx="50" cy="76" r="5.5" fill="#7928ca" filter="url(#glow)" />
  
  <circle cx="28" cy="50" r="4.5" fill="#00e5ff" />
  <circle cx="72" cy="50" r="4.5" fill="#d946ef" />

  <!-- Center AI Core Dot -->
  <circle cx="50" cy="50" r="3" fill="#ffffff" />
</svg>
